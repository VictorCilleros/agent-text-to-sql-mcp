# Hooks exécutés à chaque commit. Installation : uv run pre-commit install
# Mise à jour des versions : uv run pre-commit autoupdate

# Script Chinook tiers, versionné tel quel (vérifiable par son empreinte SHA-256) :
# aucun hook ne doit le modifier.
exclude: ^docker/initdb/01_chinook\.sql$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # garder aligné avec la version de ruff du groupe dev
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout  # supprime les sorties des notebooks avant commit
