ordered = true
# Brésil et France sont ex aequo à la 3e place (5 clients) : l'un, l'autre, ou les deux.
references = ['''
SELECT country FROM customer GROUP BY country ORDER BY COUNT(*) DESC, country LIMIT 3
''', '''
SELECT country FROM customer GROUP BY country ORDER BY COUNT(*) DESC, country DESC LIMIT 3
''', '''
SELECT country FROM (
    SELECT country, COUNT(*) AS nb, RANK() OVER (ORDER BY COUNT(*) DESC) AS rang
    FROM customer GROUP BY country
) AS classement
WHERE rang <= 3 ORDER BY nb DESC, country
''']

