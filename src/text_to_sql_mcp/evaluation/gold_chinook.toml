[[question]]
id = "chinook_008"
question = "Quelle est la piste la plus longue de chaque genre ?"
question_en = "What is the longest track in each genre?"
difficulty = "difficile"
tags = ["join", "aggregation"]
ordered = false
references = ['''
SELECT genre, piste FROM (
    SELECT g.name AS genre, t.name AS piste,
           ROW_NUMBER() OVER (PARTITION BY g.genre_id ORDER BY t.milliseconds DESC, t.track_id) AS rang
    FROM track t JOIN genre g ON g.genre_id = t.genre_id
) AS classement
WHERE rang = 1
''']

[[question]]
id = "chinook_009"
question = "Quels clients ont acheté des pistes de jazz mais jamais de rock ?"
question_en = "Which customers bought jazz tracks but never rock?"
difficulty = "difficile"
tags = ["multi-join", "filter", "empty-result"]
ordered = false
references = ['''
WITH achats AS (
    SELECT DISTINCT i.customer_id, g.name AS genre
    FROM invoice i
    JOIN invoice_line il ON il.invoice_id = i.invoice_id
    JOIN track t ON t.track_id = il.track_id
    JOIN genre g ON g.genre_id = t.genre_id
)
SELECT c.first_name, c.last_name
FROM customer c
WHERE c.customer_id IN (SELECT customer_id FROM achats WHERE genre = 'Jazz')
  AND c.customer_id NOT IN (SELECT customer_id FROM achats WHERE genre = 'Rock')
''']

[[question]]
id = "chinook_010"
question = "Quel a été le chiffre d'affaires mensuel en 2025 pour les clients situés aux États-Unis ?"
question_en = "What was the monthly revenue in 2013 for customers in the USA?"
difficulty = "moyen"
tags = ["join", "aggregation", "date", "filter"]
ordered = false
references = ['''
SELECT to_char(i.invoice_date, 'YYYY-MM') AS mois, SUM(i.total) AS chiffre_affaires
FROM invoice i JOIN customer c ON c.customer_id = i.customer_id
WHERE c.country = 'USA' AND i.invoice_date >= '2025-01-01' AND i.invoice_date < '2026-01-01'
GROUP BY 1
''', '''
SELECT date_trunc('month', i.invoice_date) AS mois, SUM(i.total) AS chiffre_affaires
FROM invoice i JOIN customer c ON c.customer_id = i.customer_id
WHERE c.country = 'USA' AND i.invoice_date >= '2025-01-01' AND i.invoice_date < '2026-01-01'
GROUP BY 1
''', '''
SELECT EXTRACT(MONTH FROM i.invoice_date) AS mois, SUM(i.total) AS chiffre_affaires
FROM invoice i JOIN customer c ON c.customer_id = i.customer_id
WHERE c.country = 'USA' AND i.invoice_date >= '2025-01-01' AND i.invoice_date < '2026-01-01'
GROUP BY 1
''']

