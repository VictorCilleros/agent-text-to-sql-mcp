# Gold set de l'agent text-to-SQL sur Chinook (PostgreSQL, identifiants snake_case).
#
# Source : 43 questions du dataset « Chinook gold » du projet nl2sql
#   https://github.com/nadeem4/nl2sql — packages/nl2sql/src/nl2sql/evaluation/datasets/chinook_gold.yaml
#   commit 201f99fa94ac2e8283572bfa7a22f62366314e2a, licence MIT, © 2026 The NL2SQL Platform Authors
#   (voir LICENSE-gold-nl2sql.md à côté de ce fichier).
# Ajout maison : chinook_044 (sans réponse).
#
# Transformations par rapport à la source :
# - questions traduites en français (`question`), originale conservée (`question_en`) ;
#   noms de pays traduits, titres d'albums, d'artistes et de playlists laissés tels quels ;
# - SQL traduit de SQLite (PascalCase) vers PostgreSQL (snake_case). Chinook v1.4.5 pour
#   PostgreSQL décale les dates de +12 ans (2021-2025 au lieu de 2009-2013) : les années des
#   questions sont décalées d'autant. Chaque traduction fidèle a été vérifiée : elle redonne
#   exactement le `gold_result` publié par la source ;
# - références réduites aux colonnes qui répondent à la question : l'agent peut en ajouter
#   (une colonne en trop n'est pas une faute), pas en omettre ;
# - plusieurs références quand plusieurs formes de réponse sont justes (nom complet en une ou
#   deux colonnes, mois en texte, en date ou en numéro, ex aequo) : il suffit d'en égaler une ;
# - étiquettes de contrôle d'accès de la source (`rbac-denial`, `expected`) retirées.
#
# Champs :
#   id, question, question_en, difficulty (facile | moyen | difficile), tags,
#   ordered (true : l'ordre des lignes fait partie de la réponse ; défaut false),
#   answerable (false : la base ne contient pas l'information, l'agent doit le dire ;
#   défaut true), references (requêtes SQL de référence ; vide si answerable = false).

[[question]]
id = "chinook_001"
question = "Combien avons-nous de clients par pays ?"
question_en = "How many customers do we have, by country?"
difficulty = "facile"
tags = ["aggregation"]
ordered = false
references = ['''
SELECT country, COUNT(*) AS nb_clients FROM customer GROUP BY country
''']

[[question]]
id = "chinook_002"
question = "Quels sont les 5 clients qui ont le plus dépensé au total ?"
question_en = "Who are the top 5 customers by total spend?"
difficulty = "moyen"
tags = ["join", "aggregation", "order-limit", "paraphrase"]
ordered = false
references = ['''
SELECT c.first_name, c.last_name
FROM customer c JOIN invoice i ON i.customer_id = c.customer_id
GROUP BY c.customer_id ORDER BY SUM(i.total) DESC, c.customer_id LIMIT 5
''', '''
SELECT c.first_name || ' ' || c.last_name AS client
FROM customer c JOIN invoice i ON i.customer_id = c.customer_id
GROUP BY c.customer_id ORDER BY SUM(i.total) DESC, c.customer_id LIMIT 5
''']

